[project]
name = "rpapp"
version = "0.1.0"
requires-python = ">=3.10"
# Everything the app imports itself is listed, even what NiceGUI brings along today: what NiceGUI needs can
# change from one version to the next (NiceGUI 4.0 no longer brings httpx).
dependencies = [
    "nicegui>=3.18",                        # the pages, and the server (tested with 3.18 and 4.0)
    "fastapi",                              # (NiceGUI's server) the pictures' responses
    "starlette",                            # (under FastAPI) the device pairing guard, its pages and routes
    "uvicorn",                              # (NiceGUI's server) this computer's own address, beside it
    "wsproto",                              # that address's live connection to the browser (launcher.py)
    "pydantic>=2",                          # the data's models, and checking what's read back
    "httpx",                                # calls the AI services; the commands and the tray reach the app
    "ifaddr",                               # this computer's addresses on the network
    "pillow",                               # resizes pictures
    "tomli; python_version < '3.11'",       # reads config.toml (built into Python 3.11 and later)
    "cryptography",                         # makes the self-signed certificate for HTTPS
    "segno",                                # draws the QR codes for pairing devices
    "nh3",                                  # cleans the HTML of chat messages (see rpapp/safe_html.py)
    # vector search (see rpapp/vectors.py): runs the models, reads text the way they do, and the vectors
    "onnxruntime",
    "tokenizers",
    "numpy",
    # the tray icon (see rpapp/tray.py): pystray on Windows and macOS, D-Bus on Linux
    "pystray; sys_platform == 'win32' or sys_platform == 'darwin'",
    "dbus-fast; sys_platform == 'linux'",
]

[project.scripts]
reality-later = "rpapp.main:main"           # the app, once installed (from the source folder: python main.py)

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# The package is the rpapp folder alone: next to it are main.py, tools/, tests/, and your own data/ and
# certificates/, which setuptools would otherwise take for packages too ("Multiple top-level packages").
[tool.setuptools.packages.find]
include = ["rpapp", "rpapp.*"]

# Files the app needs besides its Python code (setuptools only takes .py files unless told):
# the picture framing tool, the fonts, the icons (the browser's and the tray's), the starter set
# (see rpapp/starter.py), and the models vector search can download (embedding_models.json). The
# programs' icons are in packaging/icons, for the builds.
[tool.setuptools.package-data]
rpapp = ["ui/*.js", "ui/fonts/*", "icons/**/*", "starter/**/*", "embedding_models.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
