
services:
  reality-later:
    image: ghcr.io/miryananovak/reality-later:main
    container_name: reality-later
    network_mode: host
    restart: unless-stopped

    volumes:
      - ./docker-data:/app/data:Z
      - ./docker-certificates:/app/certificates:Z

    environment:
      PYTHONUNBUFFERED: "1"
