services:
  reality-later:
    image: ghcr.io/miryananovak/reality-later:main
    container_name: reality-later
    network_mode: host
    restart: unless-stopped

    volumes:
      - reality-later-data:/app/data
      - reality-later-certificates:/app/certificates

    environment:
      PYTHONUNBUFFERED: "1"

volumes:
  reality-later-data:
  reality-later-certificates:
